<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A little collection of birthday messages for Safa's 24th birthday."
    />
    <meta name="theme-color" content="#fff4e8" />
    <title>Happy 24th Birthday, Safa!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div class="eyebrow"><span aria-hidden="true">✦</span> A tiny celebration for you</div>
        <h1 class="visually-hidden">Happy 24th Birthday, Safa!</h1>
        <img
          class="birthday-title"
          src="assets/birthday%20text.png"
          alt=""
          width="4318"
          height="4318"
        />
        <p class="intro">
          Tap to hear our messages :P
        </p>
        <div class="scroll-cue" aria-hidden="true">
          <span>Meet the crew</span>
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
          </svg>
        </div>
      </header>

      <main>
        <section class="messages" aria-labelledby="messages-heading">
          <div class="section-heading">
            <p class="kicker">Birthday hotline</p>
            <h2 id="messages-heading">Pick a friend</h2>
          </div>

          <div class="character-grid" id="character-grid">
            <button class="character-card card-peach" type="button" data-character="momo" aria-label="Play Momo's birthday message">
              <span class="character-number">01</span>
              <span class="portrait" aria-hidden="true">
                <svg viewBox="0 0 180 180" role="img">
                  <path d="M42 59 25 29c-3-6 4-12 10-8l31 20M138 59l17-30c3-6-4-12-10-8l-31 20" fill="#f5a58e" stroke="#482d27" stroke-linejoin="round" stroke-width="5" />
                  <path d="M34 92c0-39 22-65 56-65s56 26 56 65c0 36-22 61-56 61S34 128 34 92Z" fill="#f7ad98" stroke="#482d27" stroke-width="5" />
                  <ellipse cx="68" cy="89" rx="5" ry="7" fill="#482d27" /><ellipse cx="112" cy="89" rx="5" ry="7" fill="#482d27" />
                  <path d="M80 107c6 5 14 5 20 0" fill="none" stroke="#482d27" stroke-linecap="round" stroke-width="4" />
                  <circle cx="55" cy="105" r="8" fill="#ee806f" opacity=".55" /><circle cx="125" cy="105" r="8" fill="#ee806f" opacity=".55" />
                </svg>
              </span>
              <span class="character-info"><strong>Momo</strong><span>The soft one</span></span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card card-blue" type="button" data-character="pippin" aria-label="Play Pippin's birthday message">
              <span class="character-number">02</span>
              <span class="portrait" aria-hidden="true">
                <svg viewBox="0 0 180 180" role="img">
                  <path d="M50 64C30 42 31 18 44 15c13-3 23 22 27 42M130 64c20-22 19-46 6-49-13-3-23 22-27 42" fill="#f7f0de" stroke="#25364e" stroke-width="5" />
                  <path d="M40 94c0-38 20-63 50-63s50 25 50 63c0 35-20 59-50 59s-50-24-50-59Z" fill="#fffaf0" stroke="#25364e" stroke-width="5" />
                  <ellipse cx="70" cy="91" rx="4.5" ry="6.5" fill="#25364e" /><ellipse cx="110" cy="91" rx="4.5" ry="6.5" fill="#25364e" />
                  <path d="M83 107c4 4 10 4 14 0" fill="none" stroke="#25364e" stroke-linecap="round" stroke-width="4" />
                  <path d="M39 55c-13-10-18-21-14-25 5-5 17 5 25 18" fill="#ffd74b" stroke="#25364e" stroke-linecap="round" stroke-width="4" />
                </svg>
              </span>
              <span class="character-info"><strong>Pippin</strong><span>The daydreamer</span></span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card card-yellow" type="button" data-character="bibi" aria-label="Play Bibi's birthday message">
              <span class="character-number">03</span>
              <span class="portrait" aria-hidden="true">
                <svg viewBox="0 0 180 180" role="img">
                  <path d="m90 17 11 25 27-8-6 28 27 10-21 19 16 23-29 3-1 29-24-16-24 16-1-29-29-3 16-23-21-19 27-10-6-28 27 8 11-25Z" fill="#ffd558" stroke="#49391b" stroke-linejoin="round" stroke-width="5" />
                  <circle cx="90" cy="91" r="43" fill="#ffe27e" />
                  <ellipse cx="73" cy="87" rx="4.5" ry="6" fill="#49391b" /><ellipse cx="107" cy="87" rx="4.5" ry="6" fill="#49391b" />
                  <path d="M79 103c6 7 16 7 22 0" fill="none" stroke="#49391b" stroke-linecap="round" stroke-width="4" />
                </svg>
              </span>
              <span class="character-info"><strong>Bibi</strong><span>The sunshine</span></span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card card-green" type="button" data-character="olive" aria-label="Play Olive's birthday message">
              <span class="character-number">04</span>
              <span class="portrait" aria-hidden="true">
                <svg viewBox="0 0 180 180" role="img">
                  <circle cx="90" cy="41" r="27" fill="#f7b0bd" stroke="#294136" stroke-width="5" /><circle cx="134" cy="68" r="27" fill="#ffced4" stroke="#294136" stroke-width="5" /><circle cx="125" cy="119" r="27" fill="#f7b0bd" stroke="#294136" stroke-width="5" /><circle cx="55" cy="119" r="27" fill="#ffced4" stroke="#294136" stroke-width="5" /><circle cx="46" cy="68" r="27" fill="#f7b0bd" stroke="#294136" stroke-width="5" />
                  <circle cx="90" cy="88" r="46" fill="#f7c943" stroke="#294136" stroke-width="5" />
                  <ellipse cx="73" cy="84" rx="4.5" ry="6" fill="#294136" /><ellipse cx="107" cy="84" rx="4.5" ry="6" fill="#294136" />
                  <path d="M78 101c7 7 17 7 24 0" fill="none" stroke="#294136" stroke-linecap="round" stroke-width="4" />
                </svg>
              </span>
              <span class="character-info"><strong>Olive</strong><span>The wildflower</span></span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card card-purple" type="button" data-character="nori" aria-label="Play Nori's birthday message">
              <span class="character-number">05</span>
              <span class="portrait" aria-hidden="true">
                <svg viewBox="0 0 180 180" role="img">
                  <path d="M43 124c-20-2-27-28-12-40-8-24 13-45 35-38 9-26 47-26 56 0 23-5 41 18 31 40 15 15 3 40-18 39H43Z" fill="#f8f0ff" stroke="#3d3152" stroke-linejoin="round" stroke-width="5" />
                  <ellipse cx="73" cy="89" rx="4.5" ry="6.5" fill="#3d3152" /><ellipse cx="111" cy="89" rx="4.5" ry="6.5" fill="#3d3152" />
                  <path d="M81 105c5 5 13 5 18 0" fill="none" stroke="#3d3152" stroke-linecap="round" stroke-width="4" />
                  <path d="m124 33 4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10Z" fill="#ffe374" stroke="#3d3152" stroke-linejoin="round" stroke-width="3" />
                </svg>
              </span>
              <span class="character-info"><strong>Nori</strong><span>The night owl</span></span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>
          </div>

          <div class="now-playing" id="now-playing" aria-live="polite">
            <div class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            <div>
              <span id="player-label">Ready when you are</span>
              <strong id="player-message">Choose a friend to begin</strong>
            </div>
            <button class="stop-button" id="stop-button" type="button" aria-label="Stop message" hidden>
              <span aria-hidden="true"></span>
            </button>
          </div>
        </section>
      </main>

      <footer>
        <p>Made with a whole lot of love</p>
        <span aria-hidden="true">♥</span>
        <p>Twenty-four looks good on you</p>
      </footer>
    </div>
  </body>
</html>
