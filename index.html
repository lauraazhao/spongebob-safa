<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A little collection of birthday messages for Safa's 24th birthday."
    />
    <meta name="theme-color" content="#fff4e8" />
    <title>Happy 24th Birthday, Safa!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <div class="bubble-layer" aria-hidden="true">
        <i style="--left: 4%; --size: 34px; --duration: 13s; --delay: -4s; --drift: 34px"></i>
        <i style="--left: 11%; --size: 68px; --duration: 19s; --delay: -13s; --drift: -42px"></i>
        <i style="--left: 19%; --size: 24px; --duration: 11s; --delay: -7s; --drift: 26px"></i>
        <i style="--left: 27%; --size: 48px; --duration: 16s; --delay: -2s; --drift: -32px"></i>
        <i style="--left: 35%; --size: 82px; --duration: 22s; --delay: -18s; --drift: 48px"></i>
        <i style="--left: 43%; --size: 30px; --duration: 14s; --delay: -9s; --drift: -24px"></i>
        <i style="--left: 51%; --size: 56px; --duration: 18s; --delay: -15s; --drift: 38px"></i>
        <i style="--left: 59%; --size: 20px; --duration: 10s; --delay: -5s; --drift: -18px"></i>
        <i style="--left: 66%; --size: 72px; --duration: 21s; --delay: -11s; --drift: 44px"></i>
        <i style="--left: 73%; --size: 38px; --duration: 15s; --delay: -1s; --drift: -30px"></i>
        <i style="--left: 81%; --size: 26px; --duration: 12s; --delay: -8s; --drift: 22px"></i>
        <i style="--left: 88%; --size: 62px; --duration: 20s; --delay: -16s; --drift: -40px"></i>
        <i style="--left: 95%; --size: 42px; --duration: 17s; --delay: -6s; --drift: 28px"></i>
        <i style="--left: 15%; --size: 52px; --duration: 23s; --delay: -20s; --drift: 36px"></i>
        <i style="--left: 47%; --size: 22px; --duration: 13s; --delay: -12s; --drift: -20px"></i>
        <i style="--left: 77%; --size: 46px; --duration: 18s; --delay: -3s; --drift: 32px"></i>
      </div>
      <header class="hero">
        <h1 class="visually-hidden">Happy 24th Birthday, Safa!</h1>
        <img
          class="birthday-title"
          src="assets/birthday%20text.png"
          alt=""
          width="3215"
          height="1816"
        />
      </header>

      <main>
        <section class="messages" aria-label="Birthday audio messages">
          <div class="character-grid" id="character-grid">
            <button class="character-card" type="button" data-character="aaron" aria-label="Play Aaron's birthday message">
              <span class="portrait" aria-hidden="true">
                <img src="assets/aarongebob.png" alt="" width="1645" height="1645" />
              </span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card" type="button" data-character="gary" aria-label="Play Gary's birthday message">
              <span class="portrait" aria-hidden="true">
                <img src="assets/garyan.png" alt="" width="1645" height="1645" />
              </span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card" type="button" data-character="liny" aria-label="Play Liny's birthday message">
              <span class="portrait" aria-hidden="true">
                <img src="assets/liny%20star.png" alt="" width="1645" height="1645" />
              </span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card" type="button" data-character="mike" aria-label="Play Mike's birthday message">
              <span class="portrait" aria-hidden="true">
                <img src="assets/mikeward.png" alt="" width="1645" height="1645" />
              </span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card" type="button" data-character="laura" aria-label="Play Laura's birthday message">
              <span class="portrait" aria-hidden="true">
                <img src="assets/sandlaura.png" alt="" width="1645" height="1645" />
              </span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>
          </div>
        </section>
      </main>

    </div>
  </body>
</html>
