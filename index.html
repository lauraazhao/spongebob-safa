<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A little collection of birthday messages for Safa's 24th birthday."
    />
    <meta name="theme-color" content="#fff4e8" />
    <title>Happy 24th Birthday, Safa!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <h1 class="visually-hidden">Happy 24th Birthday, Safa!</h1>
        <img
          class="birthday-title"
          src="assets/birthday%20text.png"
          alt=""
          width="3215"
          height="1816"
        />
      </header>

      <main>
        <section class="messages" aria-label="Birthday audio messages">
          <div class="character-grid" id="character-grid">
            <button class="character-card" type="button" data-character="aaron" aria-label="Play Aaron's birthday message">
              <span class="portrait" aria-hidden="true">
                <img src="assets/aarongebob.png" alt="" width="1645" height="1645" />
              </span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card" type="button" data-character="gary" aria-label="Play Gary's birthday message">
              <span class="portrait" aria-hidden="true">
                <img src="assets/garyan.png" alt="" width="1645" height="1645" />
              </span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card" type="button" data-character="liny" aria-label="Play Liny's birthday message">
              <span class="portrait" aria-hidden="true">
                <img src="assets/liny%20star.png" alt="" width="1645" height="1645" />
              </span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card" type="button" data-character="mike" aria-label="Play Mike's birthday message">
              <span class="portrait" aria-hidden="true">
                <img src="assets/mikeward.png" alt="" width="1645" height="1645" />
              </span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card" type="button" data-character="laura" aria-label="Play Laura's birthday message">
              <span class="portrait" aria-hidden="true">
                <img src="assets/sandlaura.png" alt="" width="1645" height="1645" />
              </span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>
          </div>

          <div class="now-playing" id="now-playing" aria-live="polite">
            <div class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

            <button class="stop-button" id="stop-button" type="button" aria-label="Stop message" hidden>
              <span aria-hidden="true"></span>
            </button>
          </div>
        </section>
      </main>

    </div>
  </body>
</html>
