<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A little collection of birthday messages for Safa's 24th birthday."
    />
    <meta name="theme-color" content="#fff4e8" />
    <title>Happy 24th Birthday, Safa!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <h1 class="visually-hidden">Happy 24th Birthday, Safa!</h1>
        <img
          class="birthday-title"
          src="assets/birthday%20text.png"
          alt=""
          width="3215"
          height="1816"
        />
        <p class="intro">
          Tap to hear our messages :P
        </p>
      </header>

      <main>
        <section class="messages" aria-labelledby="messages-heading">
          <div class="section-heading">
            <p class="kicker">Birthday hotline</p>
            <h2 id="messages-heading">Pick a friend</h2>
          </div>

          <div class="character-grid" id="character-grid">
            <button class="character-card card-peach" type="button" data-character="aaron" aria-label="Play Aaron's birthday message">
              <span class="character-number">01</span>
              <span class="portrait" aria-hidden="true">
                <img src="assets/aarongebob.png" alt="" width="1645" height="1645" />
              </span>
              <span class="character-info"><strong>Aaron</strong><span>Aarongebob</span></span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card card-blue" type="button" data-character="gary" aria-label="Play Gary's birthday message">
              <span class="character-number">02</span>
              <span class="portrait" aria-hidden="true">
                <img src="assets/garyan.png" alt="" width="1645" height="1645" />
              </span>
              <span class="character-info"><strong>Gary</strong><span>Garyan</span></span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card card-yellow" type="button" data-character="liny" aria-label="Play Liny's birthday message">
              <span class="character-number">03</span>
              <span class="portrait" aria-hidden="true">
                <img src="assets/liny%20star.png" alt="" width="1645" height="1645" />
              </span>
              <span class="character-info"><strong>Liny</strong><span>Liny Star</span></span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card card-green" type="button" data-character="mike" aria-label="Play Mike's birthday message">
              <span class="character-number">04</span>
              <span class="portrait" aria-hidden="true">
                <img src="assets/mikeward.png" alt="" width="1645" height="1645" />
              </span>
              <span class="character-info"><strong>Mike</strong><span>Mikeward</span></span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>

            <button class="character-card card-purple" type="button" data-character="laura" aria-label="Play Laura's birthday message">
              <span class="character-number">05</span>
              <span class="portrait" aria-hidden="true">
                <img src="assets/sandlaura.png" alt="" width="1645" height="1645" />
              </span>
              <span class="character-info"><strong>Laura</strong><span>Sandlaura</span></span>
              <span class="play-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 7 8 5-8 5V7Z" fill="currentColor" /></svg></span>
            </button>
          </div>

          <div class="now-playing" id="now-playing" aria-live="polite">
            <div class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
            <div>
              <span id="player-label">Ready when you are</span>
              <strong id="player-message">Choose a friend to begin</strong>
            </div>
            <button class="stop-button" id="stop-button" type="button" aria-label="Stop message" hidden>
              <span aria-hidden="true"></span>
            </button>
          </div>
        </section>
      </main>

      <footer>
        <p>Made with a whole lot of love</p>
        <span aria-hidden="true">♥</span>
        <p>Twenty-four looks good on you</p>
      </footer>
    </div>
  </body>
</html>
